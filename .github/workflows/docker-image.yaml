name: build-image

# Builds the rRMSAnalyzer runtime image and pushes it to GHCR as linux/amd64.
# The local (Singularity 3.8.5) side only does `singularity pull docker://...`.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rrmsanalyzer
  R_VERSION: "4.6.1"
  PKG_VERSION: "3.0.0"
  CRAN_SNAPSHOT: "2026-10-01"

jobs:
  build:
    name: build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.R_VERSION }}-${{ env.PKG_VERSION }}
            type=raw,value=${{ env.PKG_VERSION }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      # provenance / sbom must stay disabled: they add OCI 1.1 attestation
      # manifests that Singularity 3.8.5 cannot parse ("unknown manifest class").
      # oci: false keeps Docker schema2 media types, the safest choice for 3.8.5.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CRAN_SNAPSHOT=${{ env.CRAN_SNAPSHOT }}
          provenance: false
          sbom: false
          oci: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: smoke test
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${IMAGE}:${R_VERSION}-${PKG_VERSION}

      - name: Check R and package versions
        run: |
          docker run --rm ${IMAGE}:${R_VERSION}-${PKG_VERSION} Rscript -e '
            cat("R version:", R.version.string, "\n")
            cat("rRMSAnalyzer:", as.character(packageVersion("rRMSAnalyzer")), "\n")
            cat("Bioconductor:", as.character(BiocManager::version()), "\n")
            stopifnot(getRversion() >= "4.6.0")
          '

      - name: Render a report inside the container (pandoc must work)
        run: |
          mkdir -p "$PWD/out"
          docker run --rm -v "$PWD/out:/work" ${IMAGE}:${R_VERSION}-${PKG_VERSION} Rscript -e '
            library(rRMSAnalyzer)
            data(ribo_toy)
            report_qc(ribo_toy, "human", "run", output_dir = "/work")
            files <- list.files("/work")
            print(files)
            stopifnot(any(grepl("[.]html$", files)))
          '
